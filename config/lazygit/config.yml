notARepository: "quit"
quitOnTopLevelReturn: true
promptToReturnFromSubprocess: false
git:
  pagers:
    - pager: ""
    - externalDiffCommand: difft --color=always --display=inline --syntax-highlight=off
    - pager: diff-so-fancy
os:
  copyToClipboardCmd: printf "\033]52;c;$(printf {{text}} | base64 -w 0)\a" > /dev/tty
  editPreset: "nvim"
  editInTerminal: true
gui:
  showBottomLine: false
  enlargedSideViewLocation: top
keybinding:
  files:
    commitChangesWithoutHook: <disabled>
customCommands:
  - key: w
    prompts:
      - type: input
        title: Commit summary
        initialValue: ""
    description: Commit changes without pre-commit hook
    command: git commit -n -m '{{index .PromptResponses 0}}'
    context: files
  - key: o
    context: localBranches
    command: gh pr create --fill
    description: Create pull request and auto fill via gh
    loadingText: Creating Pull Request...
    outputTitle: GH
    output: popup
